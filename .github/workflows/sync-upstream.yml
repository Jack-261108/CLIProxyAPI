name: Sync Upstream

# 定时检查官方 router-for-me/CLIProxyAPI 的最新稳定版本，
# 合并到本仓库 main 后打同名 tag，由 release.yaml 构建发布。
# 本仓库已移除的模块目录（PRUNED_MODULES）和散落在模块外的已删文件
# （PRUNED_FILES）在合并后会被自动裁剪，避免上游持续修改这些文件导致
# modify/delete 冲突。
# 其余冲突、或裁剪后编译不通过时，中止本次同步并创建 issue，
# 同时按需发送 Telegram 通知，不自动发布。
# Telegram 通知需要配置仓库 secrets：TELEGRAM_BOT_TOKEN、TELEGRAM_CHAT_ID；
# 未配置时自动跳过。

on:
  schedule:
    # 每 6 小时的第 17 分（UTC）
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: router-for-me/CLIProxyAPI
  # Module trees this repository has intentionally removed. Upstream keeps
  # modifying them, so every sync would otherwise hit modify/delete conflicts.
  PRUNED_MODULES: internal/tui internal/home internal/homeplugins internal/pluginstore sdk/pluginstore
  # Individual files deleted by the same pruning commit (558a4415) that live
  # OUTSIDE those module trees. They are mostly the home/plugin plumbing that
  # spanned packages: redis queue protocol, plugin store handlers, the
  # service_home_* family, log forwarders, and tests for all of it.
  #
  # Without this list each one is a latent modify/delete conflict: the moment
  # upstream touches any of them, git stops the merge and a human has to work
  # out whether the change is "pruned-module plumbing" or real upstream work.
  # Listing them makes the pruning self-healing — upstream resurrects a file,
  # the next sync removes it again, exactly like PRUNED_MODULES.
  PRUNED_FILES: >-
    internal/api/handlers/management/plugin_store.go
    internal/api/handlers/management/plugin_store_release.go
    internal/api/handlers/management/plugin_store_release_test.go
    internal/api/handlers/management/plugin_store_test.go
    internal/api/home_models_empty_test.go
    internal/api/redis_queue_protocol.go
    internal/api/redis_queue_protocol_integration_test.go
    internal/api/server_home_tool_search_test.go
    internal/logging/home_app_log_forwarder.go
    internal/logging/home_app_log_forwarder_test.go
    internal/logging/home_rebalance_log_test.go
    internal/pluginhost/home_executor_lifecycle_test.go
    internal/pluginhost/home_executor_test.go
    internal/runtime/executor/helps/cache_helpers_test.go
    internal/runtime/executor/helps/home_refresh_test.go
    sdk/cliproxy/auth/home_in_flight_publisher.go
    sdk/cliproxy/auth/home_in_flight_publisher_test.go
    sdk/cliproxy/home_plugins.go
    sdk/cliproxy/home_plugins_test.go
    sdk/cliproxy/service_home.go
    sdk/cliproxy/service_home_cancellation_test.go
    sdk/cliproxy/service_home_rebalance_finalization_test.go
    sdk/cliproxy/service_home_rebalance_release_test.go
    sdk/cliproxy/service_home_rebalance_test.go
    sdk/cliproxy/service_home_retry.go
    sdk/cliproxy/service_home_retry_test.go

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      synced: ${{ steps.gate.outputs.run }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 解析上游最新稳定版本
        id: upstream
        run: |
          set -euo pipefail
          latest="$(
            git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" 'v*' \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"
          if [[ -z "$latest" ]]; then
            echo "无法解析上游最新版本" >&2
            exit 1
          fi
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          echo "上游最新稳定版本: ${latest}"

      - name: 判断是否已发布
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "已发布 ${TAG}，跳过" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "待同步 ${TAG}" >> "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 合并上游版本
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            "refs/tags/${TAG}:refs/tags/upstream-${TAG}"

          # Find an existing *open* issue with exactly this title. Returns the
          # number on stdout, non-zero when there is none.
          #
          # Exact string comparison, not a search query: `gh issue list --search`
          # matches loosely (substring, word-splitting, punctuation), so a title
          # like "上游 v8.1.1 自动同步冲突" could match "上游 v8.1.10 自动同步冲突"
          # and the new failure would be silently filed under the wrong issue.
          # Read the raw list and compare in bash instead.
          #
          # The query itself is fail-OPEN on purpose: if the API call breaks, a
          # missing issue is worse than a duplicate one — a duplicate is noise,
          # but no issue means the failure has no record at all.
          find_open_issue_by_title() {
            local title="$1" num t url out
            if ! out="$(gh issue list -R "${GITHUB_REPOSITORY}" \
                          --state open --limit 200 \
                          --json number,title \
                          --jq '.[] | "\(.number)\t\(.title)"' 2>/tmp/gh-issue-list.err)"; then
              echo "::warning::查询 open issue 失败，按「无同名 issue」继续创建：$(head -c 200 /tmp/gh-issue-list.err)" >&2
              return 1
            fi
            while IFS=$'\t' read -r num t; do
              [ -z "${num:-}" ] && continue
              if [ "$t" = "$title" ]; then
                printf '%s' "$num"
                return 0
              fi
            done <<< "$out"
            return 1
          }

          # Abort any half-finished merge before reporting, then create the tracking
          # issue and notify Telegram. Nothing is ever pushed from this path.
          fail_sync() {
            local title="$1"
            local details="$2"
            git merge --abort >/dev/null 2>&1 || true
            {
              echo "## ${title}"
              echo
              echo "同步 \`${TAG}\` 已中止，未推送任何改动。"
              echo
              echo "已自动裁剪的已移除模块/文件：${pruned:-无}"
              echo
              printf '%s\n' "$details"
              echo
              echo "处理方式：本地执行 \`git fetch https://github.com/${UPSTREAM_REPO}.git refs/tags/${TAG}:refs/tags/upstream-${TAG}\` 后手动 \`git merge upstream-${TAG}\` 解决并推送，再手动运行本工作流。"
            } > /tmp/issue-body.md
            # Re-use the open issue if this exact failure is already tracked.
            # A cron retry, a re-dispatch, or a second run against the same tag
            # would otherwise open one duplicate per attempt, and the resolver's
            # "Closes #n" then has to close a growing pile of the same report.
            local issue_url existing
            if existing="$(find_open_issue_by_title "$title")"; then
              issue_url="$(gh issue view "$existing" -R "${GITHUB_REPOSITORY}" --json url --jq .url)"
              echo "已存在同名 open issue #${existing}，追加评论而不新建。"
              if gh issue comment "$existing" -R "${GITHUB_REPOSITORY}" --body-file /tmp/issue-body.md >/dev/null; then
                echo "已在 #${existing} 追加一条失败记录。"
              else
                echo "::warning::向 #${existing} 追加评论失败（issue 已存在，继续）"
              fi
            else
              issue_url="$(gh issue create -R "${GITHUB_REPOSITORY}" \
                --title "$title" \
                --body-file /tmp/issue-body.md)"
            fi

            if [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
              local message
              message="$(printf '%s\n' \
                "$title" \
                "仓库: ${GITHUB_REPOSITORY}" \
                "Issue: ${issue_url}" \
                "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
              if ! curl -fsS --retry 3 --max-time 15 \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${message}" \
                --data-urlencode "disable_web_page_preview=true" >/dev/null; then
                echo "::warning::Telegram 通知发送失败"
              fi
            else
              echo "未配置 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID，跳过 Telegram 通知"
            fi
            exit 1
          }

          # Stop before committing so a failed verification can be rolled back with
          # a plain merge --abort.
          merge_status=0
          git merge --no-ff --no-commit --no-edit "upstream-${TAG}" || merge_status=$?

          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            if [[ $merge_status -eq 0 ]]; then
              # Already up to date: a previous run pushed but never published the tag.
              echo "main 已包含 ${TAG}，继续打 tag 发布" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            fail_sync "上游 ${TAG} 自动同步失败（git merge 退出码 ${merge_status}）" \
              "git merge 未能启动合并，通常是有未跟踪文件与上游新增文件冲突。"
          fi

          # Always re-prune: upstream may resurrect a removed module with brand-new
          # files, which merges cleanly and would otherwise leak back into the tree.
          pruned=""
          for module in ${PRUNED_MODULES}; do
            if [[ -n "$(git ls-files -- "$module")" ]]; then
              git rm -r -q --force "$module"
              pruned="${pruned}${module} "
            fi
          done
          # Files deleted by the pruning commit that sit outside those trees.
          # `git rm -r` works on a single path too; the ls-files guard is what
          # makes this idempotent — a path upstream no longer ships is simply
          # skipped instead of failing the whole step.
          for f in ${PRUNED_FILES}; do
            if [[ -n "$(git ls-files -- "$f")" ]]; then
              git rm -r -q --force "$f"
              pruned="${pruned}${f} "
            fi
          done

          remaining="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$remaining" ]]; then
            details="以下文件需要人工解决冲突："$'\n\n'
            details+="$(printf '%s\n' "$remaining" | awk '{print "- `" $0 "`"}')"
            fail_sync "上游 ${TAG} 自动同步冲突" "$details"
          fi

          # Full logs are dominated by "ok ... [no tests to run]" lines, so the error
          # that actually broke the build is usually near the top. Print the error
          # lines themselves, falling back to the tail when nothing matches.
          log_excerpt() {
            local log="$1"
            local errs
            errs="$(grep -nE '\.go:[0-9]+:|no required module provides|cannot find package|undefined:|^--- FAIL|^FAIL[[:space:]]' "$log" | head -n 30 || true)"
            if [[ -n "$errs" ]]; then
              printf '%s\n' "$errs"
            else
              tail -n 40 "$log"
            fi
          }

          # A clean merge is not proof of a working tree: tests in surviving packages
          # may still reference the pruned modules, and upstream may break the build.
          if ! go build ./... > /tmp/go-build.log 2>&1; then
            details="合并结果无法编译："$'\n\n```\n'"$(log_excerpt /tmp/go-build.log)"$'\n```'
            fail_sync "上游 ${TAG} 自动同步构建失败" "$details"
          fi
          if ! go test -run '^$' ./... > /tmp/go-testcompile.log 2>&1; then
            details="合并结果中的测试代码无法编译（常见原因：仍在引用已移除模块的测试）："$'\n\n```\n'
            details+="$(log_excerpt /tmp/go-testcompile.log)"
            details+=$'\n```'
            fail_sync "上游 ${TAG} 自动同步测试编译失败" "$details"
          fi

          git commit --no-edit
          echo "合并 ${TAG} 成功" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$pruned" ]]; then
            echo "已自动裁剪已移除模块/文件：${pruned}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 推送 main 并打 tag
        if: steps.gate.outputs.run == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub 偶发返回服务端错误（fatal error in commit_refs_rules、Internal Server
          # Error、5xx），同一条推送稍后重试通常就成功；策略性拒绝（分支保护、必须签名、
          # non-fast-forward）重试也不会变，因此只对服务端错误做有界重试，其余立即失败。
          push_retry() {
            local attempt log="/tmp/push-retry.log"
            for attempt in 1 2 3 4; do
              if git "$@" > "$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log" >&2
              if ! grep -qiE 'commit_refs_rules|internal server error|http 5[0-9]{2}|rpc failed|remote end hung up|connection (reset|timed out)' "$log"; then
                return 1
              fi
              if [[ $attempt -eq 4 ]]; then
                echo "::error::推送连续 ${attempt} 次被服务端拒绝，疑似持续故障，不再重试"
                return 1
              fi
              echo "::warning::服务端瞬时拒绝，$((attempt * 10)) 秒后重试（第 ${attempt}/4 次）"
              sleep $((attempt * 10))
            done
          }

          push_retry push origin HEAD:main
          # 本地可能已存在同名的官方 tag，强制指向本仓库的合并结果
          git tag -f "$TAG" HEAD
          push_retry push -f origin "refs/tags/${TAG}"
          echo "已推送 tag ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN 推送的 tag 不会触发新的 workflow 运行，
  # 因此在同一工作流内直接调用发布流程。
  release:
    name: 构建发布
    needs: sync
    if: needs.sync.outputs.synced == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.sync.outputs.tag }}
