name: Release

# Triggered by matching tags pushed from sync-upstream.yml, builds linux/amd64 binary and publishes release.
# Asset naming matches official release convention for direct compatibility with existing update scripts:
#   CLIProxyAPI_<version>_linux_amd64.tar.gz
#   checksums.txt

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rebuild and publish (e.g. v8.0.46)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux-amd64:
    name: build linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建并打包
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          archive_dir="dist/archive"
          rm -rf dist
          mkdir -p "$archive_dir"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${version} -X main.Commit=${commit} -X main.BuildDate=${build_date}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/CLIProxyAPI_${version}_linux_amd64.tar.gz" \
            cli-proxy-api LICENSE README.md README_CN.md config.example.yaml

          (
            cd dist
            sha256sum CLIProxyAPI_*.tar.gz > checksums.txt
            cat checksums.txt
          )

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          UPSTREAM_REPO: router-for-me/CLIProxyAPI
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          upstream_notes=""
          if upstream_body="$(gh release view "$TAG" -R "$UPSTREAM_REPO" --json body -q 'select(.body != null) | .body' 2>/dev/null)"; then
            # Strip upstream multi-platform asset notes (this fork only builds linux/amd64)
            # and remove "What's Changed" / "New Contributors" sections (contain @mentions
            # that would incorrectly notify upstream contributors on this fork's releases).
            upstream_notes="$(printf '%s\n' "$upstream_body" \
              | tr -d '\r' \
              | sed '/<!-- cliproxyapi-linux-release-assets:start -->/,/<!-- cliproxyapi-linux-release-assets:end -->/d' \
              | awk '/^## (What'\''s Changed|New Contributors)/{skip=1; next} /^\*\*Full Changelog\*\*/{skip=0} !skip' \
              | sed '/./,$!d')"
          fi

          previous_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## 构建说明"
            echo
            echo "基于官方 \`${TAG}\` 构建，已移除 v8.0.44 引入的下游响应压缩功能（长连接场景下 zstd 编码器导致内存增长）。"
            echo
            echo "- 平台：linux/amd64（CGO，支持动态库插件）"
            echo "- 资产：\`CLIProxyAPI_${TAG#v}_linux_amd64.tar.gz\`、\`checksums.txt\`"
            if [[ -n "$(printf '%s' "$upstream_notes" | tr -d '[:space:]')" ]]; then
              echo
              echo "---"
              echo
              printf '%s\n' "$upstream_notes"
            elif [[ -n "$previous_tag" ]]; then
              echo
              echo "---"
              echo
              echo "## 变更"
              echo
              git log --reverse --pretty=format:'- %s (%h)' "${previous_tag}..${TAG}" | grep -Ev '^- (docs:|test:)' || true
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${TAG}"
            fi
          } > "$notes_file"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/CLIProxyAPI_*.tar.gz dist/checksums.txt --clobber
            gh release edit "$TAG" --title "$TAG" --draft=false --notes-file "$notes_file"
          else
            gh release create "$TAG" dist/CLIProxyAPI_*.tar.gz dist/checksums.txt \
              --title "$TAG" --notes-file "$notes_file"
          fi
